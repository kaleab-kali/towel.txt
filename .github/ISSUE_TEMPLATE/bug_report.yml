name: Bug report
description: Report a reproducible issue with Towel.txt.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what part of the CLI was involved?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Paste the exact command that reproduced the issue.
      placeholder: towel-txt document.md --output document.html --strict
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Minimal Markdown input
      description: Provide the smallest Markdown sample that reproduces the issue.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List any setup steps needed before running the command.
      placeholder: |
        1. Create document.md with the Markdown above.
        2. Run the command above.
        3. Open the generated output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include warnings, exit code, or output differences.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "towel-txt 0.1.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "node --version"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Add logs, screenshots, generated HTML snippets, or browser details if relevant.
